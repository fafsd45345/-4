
name: Build mod
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            25
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 9.2.0
      - run: gradle build --no-daemon -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64
      - uses: actions/upload-artifact@v4
        with:
          name: jungleairship-jar
          path: build/libs/*.jar
 
